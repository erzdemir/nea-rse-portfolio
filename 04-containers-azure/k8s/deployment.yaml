# Reading-level Kubernetes objects for interview discussion.
# Not a production AKS manifest (no HPA, PDB, network policy, or secrets).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: endf-ingest
  labels:
    app: endf-ingest
spec:
  replicas: 2
  selector:
    matchLabels:
      app: endf-ingest
  template:
    metadata:
      labels:
        app: endf-ingest
    spec:
      containers:
        - name: ingest
          image: ghcr.example/nea-demo/endf-ingest:0.1.0
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: endf-ingest
spec:
  selector:
    app: endf-ingest
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
